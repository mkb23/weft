[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
version = "0.4.1"
description = "A tiny shared work graph for agents and the people they work with"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.scripts]
weft = "weft:main"

[tool.setuptools]
py-modules = ["weft"]
